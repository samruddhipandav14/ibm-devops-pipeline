apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ibm-devops-pipelinerun
  namespace: default
spec:
  pipelineRef:
    name: ibm-devops-pipeline
  params:
    - name: license-server
      value: <please insert License server ip address"
  taskRunTemplate:
    podTemplate:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
