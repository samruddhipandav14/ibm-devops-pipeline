---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ibm-devops-pipeline
  namespace: default
spec:
  params:
    - name: namespace
      type: string
      default: devops-loop
    - name: mongodb-namespace
      type: string
      default: devops-loop
    - name: mongo-image-tag
      type: string
      default: 8.0.28
    - name: mongo-image-repo
      type: string
      default: docker.io/library/mongo
    - name: mongo-helm-release-name
      type: string
      default: devops-loop-mongo
    - name: mongo-pvc-size
      type: string
      default: 20Gi
    - name: mongo-additional-install-options
      type: string
      default: ''
    - name: file-storage-class
      type: string
      default: ocs-external-storagecluster-cephfs
    - name: block-storage-class
      type: string
      default: ocs-external-storagecluster-ceph-rbd
    - name: license-server
      type: string
    - name: loop-version
      type: string
      default: 3.0.0
    - name: additional-helm-options
      type: string
      default: ''
    - name: devops-loop-helm-name
      type: string
      default: devops-loop
    - name: mongo-install-mode
      type: string
      default: managed
    - name: mongodb-migration-confirmed
      type: string
      default: 'false'
    - name: installation-secret
      type: string
      default: devops-loop-install
    - name: tls-cert-secret-name
      type: string
      default: ''
    - name: appscan-enabled
      type: string
      default: 'false'
    - name: appscan-external-url
      type: string
      default: ''
  tasks:
    - name: create-namespace-for-ibm-devops
      displayName: Create Namespace For IBM DevOps
      taskSpec:
        steps:
          - name: create-namespace
            image: docker.io/knickkennedy/k8s-tools@sha256:542002707d909d25b3ed05654f77c514a507b1fc916ad3d44adb5a672adb4299
            script: |
              #!/bin/bash
              set -euo pipefail
              oc create namespace "$(params.namespace)" --dry-run=client -o yaml | oc apply -f -
    - name: deploy-mongodb
      runAfter:
        - create-namespace-for-ibm-devops
      taskSpec:
        steps:
          - name: deploy-mongo
            image: docker.io/knickkennedy/k8s-tools@sha256:542002707d909d25b3ed05654f77c514a507b1fc916ad3d44adb5a672adb4299
            script: |
              #!/bin/bash
              set -euo pipefail
              NAMESPACE="$(params.namespace)"
              MONGO_NAMESPACE="$(params.mongodb-namespace)"
              MONGO_HELM_RELEASE_NAME="$(params.mongo-helm-release-name)"
              MONGO_IMAGE_TAG="$(params.mongo-image-tag)"
              MONGO_IMAGE_REPO="$(params.mongo-image-repo)"
              MONGO_PVC_SIZE="$(params.mongo-pvc-size)"
              MONGO_INSTALL_MODE="$(params.mongo-install-mode)"
              RWO_STORAGE_CLASS="$(params.block-storage-class)"
              # Never mount an old Bitnami data volume into MongoDB 8.
              if oc get secret "${MONGO_HELM_RELEASE_NAME}-mongodb" -n "${MONGO_NAMESPACE}" >/dev/null 2>&1; then
                if [ "$(params.mongodb-migration-confirmed)" != "true" ] || ! oc get secret mongodb-url-secret -n "${NAMESPACE}" >/dev/null 2>&1; then
                  echo "Existing Bitnami MongoDB detected. Back up and migrate to supported MongoDB 7/8, update mongodb-url-secret, then confirm migration."
                  exit 1
                fi
              fi
              helm repo add ibm-helm https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm --force-update
              helm repo update
              helm pull --untar ibm-helm/ibm-devops-loop --version "$(params.loop-version)"
              source ./ibm-devops-loop/scripts/mongodb.sh
              KUBE_CMD=oc ensure_mongodb_url_secret
    - name: deploy-ibm-ucv-helm-chart
      runAfter:
        - deploy-mongodb
      taskSpec:
        steps:
          - name: deploy-loop
            image: docker.io/knickkennedy/k8s-tools@sha256:542002707d909d25b3ed05654f77c514a507b1fc916ad3d44adb5a672adb4299
            script: |
              #!/bin/bash
              set -euo pipefail

              helm repo add ibm-helm https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm --force-update
              helm repo update

              helm pull --untar ibm-helm/ibm-devops-loop --version "$(params.loop-version)"
              ROOT_DIR=./ibm-devops-loop

              DOMAIN=automation.$(oc get -n openshift-ingress-operator ingresscontroller default -o jsonpath='{.status.domain}')
              PASSWORD_SEED=EOGsIClq5SexCijpqTBEx5IBcBQ1FUtBAMxWF1kiAHs=
              EMAIL_SERVER_HOST=smtp.sendgrid.net
              EMAIL_SERVER_PORT=2525
              EMAIL_FROM_ADDRESS=IBMDevopsAutomation@outlook.com
              EMAIL_SERVER_USERNAME="apikey"
              EMAIL_SERVER_PASSWORD="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"
              EMAIL_SERVER_STARTTLS=false
              EMAIL_SERVER_SMTPS=false

              ADDITIONAL_HELM_OPTIONS="$(params.additional-helm-options)"
              TLS_CERT_SECRET_NAME="$(params.tls-cert-secret-name)"

              ACCEPT_LICENSE=true
              HELM_NAME=$(params.devops-loop-helm-name)

              LICENSE_SERVER="$(params.license-server)"
              RWX_STORAGE_CLASS="$(params.file-storage-class)"
              RWO_STORAGE_CLASS="$(params.block-storage-class)"

              HELM_OPTIONS="${HELM_OPTIONS:-} \
              --set global.domain=${DOMAIN} \
              --set global.platform.smtp.sender=${EMAIL_FROM_ADDRESS} \
              --set global.platform.smtp.host=${EMAIL_SERVER_HOST} \
              --set global.platform.smtp.port=${EMAIL_SERVER_PORT} \
              --set global.platform.smtp.username=${EMAIL_SERVER_USERNAME} \
              --set global.platform.smtp.startTLS=${EMAIL_SERVER_STARTTLS} \
              --set global.platform.smtp.smtps=${EMAIL_SERVER_SMTPS} \
              --set license=${ACCEPT_LICENSE} \
              --set global.ibmCertSecretName=${TLS_CERT_SECRET_NAME} \
              --set platform.appscan.enabled=$(params.appscan-enabled) \
              --set-string platform.appscan.externalURL=$(params.appscan-external-url) \
              --set ibm-ucv-prod.secrets.database=mongodb-url-secret \
              --set harbor.enabled=false \
              --set global.persistence.rwxStorageClass=${RWX_STORAGE_CLASS} \
              --set global.persistence.rwoStorageClass=${RWO_STORAGE_CLASS} \
              --set ibm-devopsplan-prod.persistence.analytics.data.storageClass=${RWX_STORAGE_CLASS} \
              --set ibm-devopsplan-prod.persistence.analytics.config.storageClass=${RWX_STORAGE_CLASS} \
              --set ibm-devopsplan-prod.persistence.analytics.logs.storageClass=${RWX_STORAGE_CLASS} \
              --set ibm-devopsplan-prod.persistence.analytics.share.storageClass=${RWX_STORAGE_CLASS} \
              "

              if [ -n "${LICENSE_SERVER}" ]; then
                  HELM_OPTIONS="${HELM_OPTIONS} --set global.rationalLicenseKeyServer=@${LICENSE_SERVER}"
              fi

              if [ -n "${RWX_STORAGE_CLASS}" ]; then
                  HELM_OPTIONS="${HELM_OPTIONS} --set global.persistence.rwxStorageClass=${RWX_STORAGE_CLASS}"
              fi

              if [ -n "${RWO_STORAGE_CLASS}" ]; then
                  HELM_OPTIONS="${HELM_OPTIONS} --set global.persistence.rwoStorageClass=${RWO_STORAGE_CLASS}"
              fi

              HELM_OPTIONS="${HELM_OPTIONS} ${ADDITIONAL_HELM_OPTIONS}"
              helm upgrade --install ${HELM_NAME} ${ROOT_DIR} --version "$(params.loop-version)" ${HELM_OPTIONS} --set-literal "global.passwordSeed=${PASSWORD_SEED}" --set-literal "global.platform.smtp.password=${EMAIL_SERVER_PASSWORD}" -n $(params.namespace) -f ${ROOT_DIR}/values-openshift.yaml
